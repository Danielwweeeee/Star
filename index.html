<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>全球爆旋陀螺 戰星排行榜 (Beyblade Star Tracker)</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        .page { display: none; }
        .active { display: block; }
    </style>
</head>
<body class="bg-slate-900 text-white font-sans">

    <div class="max-w-md mx-auto p-4 min-h-screen flex flex-col justify-between">
        
        <header class="text-center my-4">
            <h1 class="text-3xl font-extrabold text-amber-400 tracking-wider">💥 BEYBLADE STARS</h1>
            <p class="text-xs text-slate-400">全球陀螺決鬥計星系統</p>
        </header>

        <main class="flex-grow">
            <div id="page-login" class="page active space-y-6 py-6">
                <div class="text-center">
                    <p class="text-slate-300">歡迎來到陀螺戰星網！請登入你的帳號。</p>
                </div>
                
                <div class="bg-slate-800 p-6 rounded-2xl border border-slate-700 shadow-xl space-y-4">
                    <div>
                        <label class="block text-xs font-bold text-slate-400 uppercase mb-1">登入帳號 (Email)</label>
                        <input id="login-email" type="email" placeholder="example@mail.com" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-3 text-sm focus:outline-none focus:border-amber-400">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-400 uppercase mb-1">密碼</label>
                        <input id="login-password" type="password" placeholder="請輸入密碼" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-3 text-sm focus:outline-none focus:border-amber-400">
                    </div>

                    <button id="btn-login" class="w-full bg-amber-500 hover:bg-amber-600 text-slate-900 font-bold py-3 rounded-lg transition text-sm">
                        🔑 登入
                    </button>

                    <div class="text-center pt-2">
                        <button onclick="switchPage('register')" class="text-xs text-amber-400 hover:underline">
                            未有帳號？點擊這裡註冊新帳號 📝
                        </button>
                    </div>
                </div>
            </div>

            <div id="page-register" class="page space-y-6 py-6">
                <div class="text-center">
                    <p class="text-slate-300">建立新帳號，加入全球陀螺戰星行列！</p>
                </div>
                
                <div class="bg-slate-800 p-6 rounded-2xl border border-slate-700 shadow-xl space-y-4">
                    <div>
                        <label class="block text-xs font-bold text-slate-400 uppercase mb-1">玩家暱稱</label>
                        <input id="reg-username" type="text" placeholder="例如：陀螺王阿豪" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-3 text-sm focus:outline-none focus:border-amber-400">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-400 uppercase mb-1">註冊帳號 (Email 格式)</label>
                        <input id="reg-email" type="email" placeholder="example@mail.com" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-3 text-sm focus:outline-none focus:border-amber-400">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-400 uppercase mb-1">設定密碼</label>
                        <input id="reg-password" type="password" placeholder="至少 6 位數" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-3 text-sm focus:outline-none focus:border-amber-400">
                    </div>

                    <button id="btn-register" class="w-full bg-slate-700 hover:bg-slate-600 text-white font-bold py-3 rounded-lg transition text-sm">
                        📝 註冊新帳號
                    </button>

                    <div class="text-center pt-2">
                        <button onclick="switchPage('login')" class="text-xs text-slate-400 hover:underline">
                            ⬅️ 返回登入頁面
                        </button>
                    </div>
                </div>
            </div>

            <div id="page-dashboard" class="page space-y-6">
                <div class="bg-slate-800 p-6 rounded-2xl text-center border border-slate-700 shadow-xl">
                    
                    <div class="relative inline-block group">
                        <div id="user-avatar-display" class="w-20 h-20 rounded-full mx-auto border-4 border-amber-400 mb-2 bg-slate-900 flex items-center justify-center text-3xl cursor-pointer hover:scale-105 transition duration-200">🥏</div>
                        <span class="absolute bottom-1 right-0 bg-amber-500 text-slate-900 text-[10px] font-bold px-1 rounded border border-slate-800">修改</span>
                    </div>

                    <h2 id="user-name" class="text-xl font-bold">玩家名字</h2>
                    
                    <div id="avatar-selector-panel" class="hidden mt-4 p-3 bg-slate-900 rounded-xl border border-slate-700 animate-fadeIn">
                        <p class="text-xs text-slate-400 mb-2">請選擇你的陀螺手 Icon：</p>
                        <div class="grid grid-cols-4 gap-2 text-2xl">
                            <button onclick="changeAvatar('🥏')" class="p-2 hover:bg-slate-700 rounded transition">🥏</button>
                            <button onclick="changeAvatar('🔥')" class="p-2 hover:bg-slate-700 rounded transition">🔥</button>
                            <button onclick="changeAvatar('⚡')" class="p-2 hover:bg-slate-700 rounded transition">⚡</button>
                            <button onclick="changeAvatar('🐉')" class="p-2 hover:bg-slate-700 rounded transition">🐉</button>
                            <button onclick="changeAvatar('🦁')" class="p-2 hover:bg-slate-700 rounded transition">🦁</button>
                            <button onclick="changeAvatar('🦅')" class="p-2 hover:bg-slate-700 rounded transition">🦅</button>
                            <button onclick="changeAvatar('🦊')" class="p-2 hover:bg-slate-700 rounded transition">🦊</button>
                            <button onclick="changeAvatar('👑')" class="p-2 hover:bg-slate-700 rounded transition">👑</button>
                        </div>
                    </div>
                    
                    <div class="mt-4 bg-slate-900 p-4 rounded-xl">
                        <p class="text-xs text-amber-400 font-bold tracking-widest uppercase">目前星星數量</p>
                        <div class="text-5xl font-black text-amber-400 my-1 flex justify-center items-center gap-1">
                            ⭐ <span id="user-stars">10</span>
                        </div>
                    </div>
                </div>

                <div class="bg-slate-800 p-6 rounded-2xl text-center border border-slate-700">
                    <h3 class="font-bold mb-2 text-sm text-slate-300">讓對手掃描你進行對戰：</h3>
                    <div id="qrcode" class="bg-white p-3 inline-block rounded-lg shadow-inner my-2"></div>
                    <p class="text-xs text-slate-400 mt-2">對手贏了將會獲得你的一粒星</p>
                </div>
            </div>

            <div id="page-scan" class="page space-y-4">
                <h3 class="text-lg font-bold text-center text-amber-400">📷 掃描對方的 QR Code</h3>
                <p class="text-xs text-slate-400 text-center">請對準對方的對戰 QR Code。打贏對方後即可奪取一粒星！</p>
                <div id="reader" class="w-full overflow-hidden rounded-xl bg-black"></div>
                <button onclick="switchPage('dashboard')" class="w-full bg-slate-700 py-2 rounded-lg text-sm">取消掃描</button>
            </div>

            <div id="page-leaderboard" class="page space-y-4">
                <h3 class="text-xl font-bold text-center text-amber-400">🏆 全球星數排行榜</h3>
                <div class="bg-slate-800 rounded-xl overflow-hidden border border-slate-700">
                    <table class="w-full text-left border-collapse">
                        <thead>
                            <tr class="bg-slate-700 text-slate-300 text-sm">
                                <th class="p-3 text-center w-16">排名</th>
                                <th class="p-3">玩家</th>
                                <th class="p-3 text-right">星數</th>
                            </tr>
                        </thead>
                        <tbody id="leaderboard-body" class="divide-y divide-slate-700 text-sm">
                        </tbody>
                    </table>
                </div>
            </div>
        </main>

        <nav id="bottom-nav" class="hidden bg-slate-800 border-t border-slate-700 -mx-4 -mb-4 p-2 flex justify-around text-slate-400 text-xs mt-6">
            <button onclick="switchPage('dashboard')" class="flex flex-col items-center p-2 gap-1 focus:text-amber-400">
                <span>🏠</span><span>首頁</span>
            </button>
            <button onclick="startScanner()" class="flex flex-col items-center p-2 gap-1 focus:text-amber-400 bg-amber-500 text-slate-900 rounded-xl px-4 font-bold -mt-4 shadow-lg">
                <span>📷</span><span>對戰 Scan</span>
            </button>
            <button onclick="loadLeaderboard(); switchPage('leaderboard')" class="flex flex-col items-center p-2 gap-1 focus:text-amber-400">
                <span>🏆</span><span>排行榜</span>
            </button>
            <button id="btn-logout" class="flex flex-col items-center p-2 gap-1 text-red-400">
                <span>🚪</span><span>登出</span>
            </button>
        </nav>
    </div>

    <script>
        const SUPABASE_URL = 'https://rqeeoseodyyqoowzjdro.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_kZOI0G-2URfup1lKzME3uw_1tgvzMDl';
        
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        let currentUser = null;
        let html5QrcodeScanner = null;

        window.onload = async () => {
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (session) {
                handleUserLogin(session.user);
            } else {
                switchPage('login');
            }
            
            supabaseClient.auth.onAuthStateChange((event, session) => {
                if (session) {
                    handleUserLogin(session.user);
                } else {
                    switchPage('login');
                    document.getElementById('bottom-nav').classList.add('hidden');
                }
            });

            // 點擊大頭像顯示/隱藏選擇面板
            document.getElementById('user-avatar-display').addEventListener('click', () => {
                const panel = document.getElementById('avatar-selector-panel');
                panel.classList.toggle('hidden');
            });
        };

        function switchPage(pageId) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.getElementById(`page-${pageId}`).classList.add('active');
            if (pageId !== 'scan' && html5QrcodeScanner) {
                html5QrcodeScanner.clear();
            }
            // 切換頁面時自動收起頭像面板
            document.getElementById('avatar-selector-panel').classList.add('hidden');
        }

        // 註冊邏輯
        document.getElementById('btn-register').addEventListener('click', async () => {
            const email = document.getElementById('reg-email').value;
            const password = document.getElementById('reg-password').value;
            const username = document.getElementById('reg-username').value || '未知陀螺手';

            if(!email || !password) {
                alert('請完整填寫 Email 和密碼！');
                return;
            }

            const { data, error } = await supabaseClient.auth.signUp({
                email: email,
                password: password,
                options: {
                    data: { full_name: username }
                }
            });

            if (error) {
                alert('註冊失敗: ' + error.message);
            } else {
                alert('註冊成功！系統已為你登入。');
            }
        });

        // 登入邏輯
        document.getElementById('btn-login').addEventListener('click', async () => {
            const email = document.getElementById('login-email').value;
            const password = document.getElementById('login-password').value;

            if(!email || !password) {
                alert('請輸入帳號和密碼！');
                return;
            }

            const { data, error } = await supabaseClient.auth.signInWithPassword({
                email: email,
                password: password
            });

            if (error) {
                alert('登入失敗: ' + error.message);
            }
        });

        document.getElementById('btn-logout').addEventListener('click', async () => {
            await supabaseClient.auth.signOut();
        });

        async function handleUserLogin(user) {
            currentUser = user;
            document.getElementById('bottom-nav').classList.remove('hidden');
            switchPage('dashboard');

            let { data: profile, error } = await supabaseClient
                .from('profiles')
                .select('*')
                .eq('id', user.id)
                .single();

            if (!profile) {
                const { data: newProfile, error: insertError } = await supabaseClient
                    .from('profiles')
                    .insert([
                        { 
                            id: user.id, 
                            username: user.user_metadata.full_name || '未知陀螺手', 
                            avatar_url: '🥏', // 🆕 預設改用文字 Emoji 圖標
                            stars: 10 
                        }
                    ])
                    .select()
                    .single();
                profile = newProfile;
            }

            document.getElementById('user-name').innerText = profile.username;
            document.getElementById('user-avatar-display').innerText = profile.avatar_url || '🥏';
            document.getElementById('user-stars').innerText = profile.stars;

            document.getElementById("qrcode").innerHTML = "";
            new QRCode(document.getElementById("qrcode"), {
                text: profile.id,
                width: 150,
                height: 150,
                colorDark : "#0f172a",
                colorLight : "#ffffff"
            });
        }

        // 🆕 新增：修改頭像並儲存至 Supabase 的功能
        async function changeAvatar(emojiIcon) {
            if (!currentUser) return;
            
            // 1. 更新 Supabase 資料庫
            const { error } = await supabaseClient
                .from('profiles')
                .update({ avatar_url: emojiIcon })
                .eq('id', currentUser.id);

            if (error) {
                alert('更新頭像失敗: ' + error.message);
            } else {
                // 2. 即時改變網頁上的頭像顯示並收起面板
                document.getElementById('user-avatar-display').innerText = emojiIcon;
                document.getElementById('avatar-selector-panel').classList.add('hidden');
            }
        }

        function startScanner() {
            switchPage('scan');
            html5QrcodeScanner = new Html5Qrcode("reader");
            html5QrcodeScanner.start(
                { facingMode: "environment" }, 
                { fps: 10, qrbox: { width: 250, height: 250 } },
                async (decodedText) => {
                    html5QrcodeScanner.stop();
                    await handleBattleWin(decodedText);
                },
                (errorMessage) => {}
            ).catch(err => alert("無法啟動相機: " + err));
        }

        async function handleBattleWin(loserId) {
            if (loserId === currentUser.id) {
                alert("唔可以自己同自己打呀！😂");
                switchPage('dashboard');
                return;
            }

            let { data: loserProfile } = await supabaseClient.from('profiles').select('stars, username').eq('id', loserId).single();
            
            if (!loserProfile) {
                alert("找不到該玩家的資料！");
                switchPage('dashboard');
                return;
            }

            if (loserProfile.stars <= 0) {
                alert(`玩家 ${loserProfile.username} 已經冇晒星星（0粒星），你贏咗都攞唔到星！`);
                switchPage('dashboard');
                return;
            }

            await supabaseClient.from('profiles').update({ stars: loserProfile.stars - 1 }).eq('id', loserId);
            let { data: myProfile } = await supabaseClient.from('profiles').select('stars').eq('id', currentUser.id).single();
            await supabaseClient.from('profiles').update({ stars: myProfile.stars + 1 }).eq('id', currentUser.id);

            alert(`🎉 恭喜！你打贏咗 ${loserProfile.username}，成功奪取 1 粒星星！`);
            handleUserLogin(currentUser);
        }

        async function loadLeaderboard() {
            let { data: profiles, error } = await supabaseClient
                .from('profiles')
                .select('*')
                .order('stars', { ascending: false })
                .limit(20);

            const tbody = document.getElementById('leaderboard-body');
            tbody.innerHTML = '';

            if (profiles) {
                profiles.forEach((player, index) => {
                    let medal = index + 1;
                    if(index === 0) medal = '🥇';
                    if(index === 1) medal = '🥈';
                    if(index === 2) medal = '🥉';

                    // 🆕 排行榜改為顯示玩家儲存的 avatar_url (Emoji)
                    const row = `
                        <tr class="hover:bg-slate-700/50">
                            <td class="p-3 text-center font-bold">${medal}</td>
                            <td class="p-3 flex items-center gap-2">
                                <div class="w-7 h-7 rounded-full bg-slate-900 border border-slate-700 flex items-center justify-center text-sm">
                                    ${player.avatar_url || '🥏'}
                                </div>
                                <span class="${player.id === currentUser?.id ? 'text-amber-400 font-bold' : ''}">${player.username}</span>
                            </td>
                            <td class="p-3 text-right font-black text-amber-400">${player.stars} ⭐</td>
                        </tr>
                    `;
                    tbody.innerHTML += row;
                });
            }
        }
    </script>
</body>
</html>
