<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>全球爆旋陀螺 戰星排行榜 (Beyblade Star Tracker)</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        .page { display: none; }
        .active { display: block; }
    </style>
</head>
<body class="bg-slate-900 text-white font-sans">

    <div class="max-w-md mx-auto p-4 min-h-screen flex flex-col justify-between">
        
        <header class="text-center my-4">
            <h1 class="text-3xl font-extrabold text-amber-400 tracking-wider">💥 BEYBLADE STARS</h1>
            <p class="text-xs text-slate-400">全球陀螺決鬥計星系統</p>
        </header>

        <main class="flex-grow">
            <div id="page-login" class="page active text-center py-10">
                <p class="mb-6 text-slate-300">歡迎來到陀螺戰星網！請先登入以記錄你的戰績。</p>
                <button id="btn-google-login" class="w-full bg-white text-slate-900 font-bold py-3 px-4 rounded-lg flex items-center justify-center gap-2 shadow-lg hover:bg-slate-100 transition">
                    <img src="https://www.google.com/favicon.ico" class="w-5 h-5" alt="Google">
                    使用 Google 帳號登入
                </button>
            </div>

            <div id="page-dashboard" class="page space-y-6">
                <div class="bg-slate-800 p-6 rounded-2xl text-center border border-slate-700 shadow-xl">
                    <img id="user-avatar" class="w-20 h-20 rounded-full mx-auto border-4 border-amber-400 mb-2" src="" alt="Avatar">
                    <h2 id="user-name" class="text-xl font-bold">玩家名字</h2>
                    
                    <div class="mt-4 bg-slate-900 p-4 rounded-xl">
                        <p class="text-xs text-amber-400 font-bold tracking-widest uppercase">目前星星數量</p>
                        <div class="text-5xl font-black text-amber-400 my-1 flex justify-center items-center gap-1">
                            ⭐ <span id="user-stars">10</span>
                        </div>
                    </div>
                </div>

                <div class="bg-slate-800 p-6 rounded-2xl text-center border border-slate-700">
                    <h3 class="font-bold mb-2 text-sm text-slate-300">讓對手掃描你進行對戰：</h3>
                    <div id="qrcode" class="bg-white p-3 inline-block rounded-lg shadow-inner my-2"></div>
                    <p class="text-xs text-slate-400 mt-2">對手贏了將會獲得你的一粒星</p>
                </div>
            </div>

            <div id="page-scan" class="page space-y-4">
                <h3 class="text-lg font-bold text-center text-amber-400">📷 掃描對方的 QR Code</h3>
                <p class="text-xs text-slate-400 text-center">請對準對方的對戰 QR Code。打贏對方後即可奪取一粒星！</p>
                <div id="reader" class="w-full overflow-hidden rounded-xl bg-black"></div>
                <button onclick="switchPage('dashboard')" class="w-full bg-slate-700 py-2 rounded-lg text-sm">取消掃描</button>
            </div>

            <div id="page-leaderboard" class="page space-y-4">
                <h3 class="text-xl font-bold text-center text-amber-400">🏆 全球星數排行榜</h3>
                <div class="bg-slate-800 rounded-xl overflow-hidden border border-slate-700">
                    <table class="w-full text-left border-collapse">
                        <thead>
                            <tr class="bg-slate-700 text-slate-300 text-sm">
                                <th class="p-3 text-center w-16">排名</th>
                                <th class="p-3">玩家</th>
                                <th class="p-3 text-right">星數</th>
                            </tr>
                        </thead>
                        <tbody id="leaderboard-body" class="divide-y divide-slate-700 text-sm">
                            </tbody>
                    </table>
                </div>
            </div>
        </main>

        <nav id="bottom-nav" class="hidden bg-slate-800 border-t border-slate-700 -mx-4 -mb-4 p-2 flex justify-around text-slate-400 text-xs mt-6">
            <button onclick="switchPage('dashboard')" class="flex flex-col items-center p-2 gap-1 focus:text-amber-400">
                <span>🏠</span><span>首頁</span>
            </button>
            <button onclick="startScanner()" class="flex flex-col items-center p-2 gap-1 focus:text-amber-400 bg-amber-500 text-slate-900 rounded-xl px-4 font-bold -mt-4 shadow-lg">
                <span>📷</span><span>對戰 Scan</span>
            </button>
            <button onclick="loadLeaderboard(); switchPage('leaderboard')" class="flex flex-col items-center p-2 gap-1 focus:text-amber-400">
                <span>🏆</span><span>排行榜</span>
            </button>
            <button id="btn-logout" class="flex flex-col items-center p-2 gap-1 text-red-400">
                <span>🚪</span><span>登出</span>
            </button>
        </nav>
    </div>

    <script>
        // === ⚠️ 請替換成你自己的 Supabase 網址同埋 API Key ===
        const SUPABASE_URL = 'https://rqeeoseodyyqoowzjdro.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_kZOI0G-2URfup1lKzME3uw_1tgvzMDl';
        
        const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        let currentUser = null;
        let html5QrcodeScanner = null;

        // 初始化檢查登入狀態
        window.onload = async () => {
            const { data: { session } } = await supabase.auth.getSession();
            if (session) {
                handleUserLogin(session.user);
            } else {
                switchPage('login');
            }
            
            // 監聽登入狀態改變
            supabase.auth.onAuthStateChange((event, session) => {
                if (session) {
                    handleUserLogin(session.user);
                } else {
                    switchPage('login');
                    document.getElementById('bottom-nav').classList.add('hidden');
                }
            });
        };

        // 頁面切換功能
        function switchPage(pageId) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.getElementById(`page-${pageId}`).classList.add('active');
            
            // 如果離開掃描頁面，關閉相機
            if (pageId !== 'scan' && html5QrcodeScanner) {
                html5QrcodeScanner.clear();
            }
        }

        // Google 登入按鈕
        document.getElementById('btn-google-login').addEventListener('click', async () => {
            await supabase.auth.signInWithOAuth({
                provider: 'google',
                options: { redirectTo: window.location.href }
            });
        });

        // 登出按鈕
        document.getElementById('btn-logout').addEventListener('click', async () => {
            await supabase.auth.signOut();
        });

        // 處理玩家登入後的資料邏輯
        async function handleUserLogin(user) {
            currentUser = user;
            document.getElementById('bottom-nav').classList.remove('hidden');
            switchPage('dashboard');

            // 1. 檢查資料庫（profiles表）有冇呢個玩家，冇就創建（初始10粒星）
            let { data: profile, error } = await supabase
                .from('profiles')
                .select('*')
                .eq('id', user.id)
                .single();

            if (!profile) {
                const { data: newProfile, error: insertError } = await supabase
                    .from('profiles')
                    .insert([
                        { 
                            id: user.id, 
                            username: user.user_metadata.full_name || '未知陀螺手', 
                            avatar_url: user.user_metadata.avatar_url || '', 
                            stars: 10 
                        }
                    ])
                    .select()
                    .single();
                profile = newProfile;
            }

            // 2. 顯示玩家資料
            document.getElementById('user-name').innerText = profile.username;
            document.getElementById('user-avatar').src = profile.avatar_url;
            document.getElementById('user-stars').innerText = profile.stars;

            // 3. 生成玩家專屬的 QR Code (內容放玩家的 User ID)
            document.getElementById("qrcode").innerHTML = ""; // 清空舊的
            new QRCode(document.getElementById("qrcode"), {
                text: profile.id,
                width: 150,
                height: 150,
                colorDark : "#0f172a",
                colorLight : "#ffffff"
            });
        }

        // 啟動相機掃描對手 QR Code
        function startScanner() {
            switchPage('scan');
            
            html5QrcodeScanner = new Html5Qrcode("reader");
            html5QrcodeScanner.start(
                { facingMode: "environment" }, 
                { fps: 10, qrbox: { width: 250, height: 250 } },
                async (decodedText) => {
                    // 掃描成功，decodedText 就是對方的 user_id
                    html5QrcodeScanner.stop();
                    await handleBattleWin(decodedText);
                },
                (errorMessage) => { /* 忽略掃描中的錯誤 */ }
            ).catch(err => alert("無法啟動相機: " + err));
        }

        // 核心對戰邏輯：你掃描對方 = 你打贏左對方
        async function handleBattleWin(loserId) {
            if (loserId === currentUser.id) {
                alert("唔可以自己同自己打呀！😂");
                switchPage('dashboard');
                return;
            }

            // 1. 先確認輸家重有冇星星
            let { data: loserProfile } = await supabase.from('profiles').select('stars, username').eq('id', loserId).single();
            
            if (!loserProfile) {
                alert("找不到該玩家的資料！");
                switchPage('dashboard');
                return;
            }

            if (loserProfile.stars <= 0) {
                alert(`玩家 ${loserProfile.username} 已經冇晒星星（0粒星），你贏咗都攞唔到星！`);
                switchPage('dashboard');
                return;
            }

            // 2. 扣除輸家一粒星
            await supabase.from('profiles').update({ stars: loserProfile.stars - 1 }).eq('id', loserId);

            // 3. 加我一粒星
            let { data: myProfile } = await supabase.from('profiles').select('stars').eq('id', currentUser.id).single();
            await supabase.from('profiles').update({ stars: myProfile.stars + 1 }).eq('id', currentUser.id);

            alert(`🎉 恭喜！你打贏咗 ${loserProfile.username}，成功奪取 1 粒星星！`);
            
            // 重新刷新個人頁面
            handleUserLogin(currentUser);
        }

        // 載入排行榜資料
        async function loadLeaderboard() {
            let { data: profiles, error } = await supabase
                .from('profiles')
                .select('*')
                .order('stars', { ascending: false })
                .limit(20); // 顯示前20名

            const tbody = document.getElementById('leaderboard-body');
            tbody.innerHTML = '';

            if (profiles) {
                profiles.forEach((player, index) => {
                    let medal = index + 1;
                    if(index === 0) medal = '🥇';
                    if(index === 1) medal = '🥈';
                    if(index === 2) medal = '🥉';

                    const row = `
                        <tr class="hover:bg-slate-700/50">
                            <td class="p-3 text-center font-bold">${medal}</td>
                            <td class="p-3 flex items-center gap-2">
                                <img src="${player.avatar_url}" class="w-6 h-6 rounded-full" alt="">
                                <span class="${player.id === currentUser?.id ? 'text-amber-400 font-bold' : ''}">${player.username}</span>
                            </td>
                            <td class="p-3 text-right font-black text-amber-400">${player.stars} ⭐</td>
                        </tr>
                    `;
                    tbody.innerHTML += row;
                });
            }
        }
    </script>
</body>
</html>
